name: Flask App Build and Deploy

on:
  push:
    branches:
      - challenging-challenge

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPO_NAME: zar-code-challenges-flask-app
  IMAGE_NAME: flask-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: |
          cd devops/simple-flask-app
          docker build . --file Dockerfile --tag $IMAGE_NAME

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/GithubOidcRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Push image
        id: push_image
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO_NAME
          FULL_IMAGE_URI=$IMAGE_URI:$IMAGE_TAG
          echo FULL_IMAGE_URI=$FULL_IMAGE_URI
          docker tag $IMAGE_NAME $FULL_IMAGE_URI
          docker push $FULL_IMAGE_URI

  deploy:
    needs: build-and-push

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: |
          cd devops/cdk/k8s
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/GithubOidcRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK diff
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO_NAME
          FULL_IMAGE_URI=$IMAGE_URI:$IMAGE_TAG
          cd devops/cdk/k8s
          npx cdk diff --context imageUri=$FULL_IMAGE_URI 

      - name: CDK deploy
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO_NAME
          FULL_IMAGE_URI=$IMAGE_URI:$IMAGE_TAG
          cd devops/cdk/k8s
          npx cdk deploy --require-approval never --context imageUri=$FULL_IMAGE_URI 
